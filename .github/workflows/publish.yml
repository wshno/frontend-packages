name: Publish

# Publishes one package to npmjs when its tag is pushed: `<package>-v<version>`, e.g. `otel-v0.2.0`
# publishes packages/otel as @wshno/otel@0.2.0. The tag's version must equal the package.json version.
#
# Auth is npm Trusted Publishing (OIDC, no stored token), and every version gets a provenance
# attestation linking it to this workflow run. Each package must list this repo and `publish.yml` as
# its trusted publisher on npmjs.com. Trusted publishing can only be set up on a package that exists,
# so the first version of a new package needs the NPM_TOKEN secret (a short-lived granular token);
# delete the secret once the trusted publisher is configured.

on:
  push:
    tags:
      - '*-v[0-9]*'

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release job: a poisoned cache would end up in a published package.
          package-manager-cache: false

      - name: Resolve the package from the tag
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="${TAG%-v*}"
          version="${TAG##*-v}"
          manifest="packages/${dir}/package.json"
          [ -f "$manifest" ] || { echo "::error::tag $TAG names no package (no $manifest)"; exit 1; }
          name="$(jq -r .name "$manifest")"
          declared="$(jq -r .version "$manifest")"
          [ "$declared" = "$version" ] || { echo "::error::$TAG says $version, $manifest says $declared"; exit 1; }
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::error::${name}@${version} is already on npm"
            exit 1
          fi
          {
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # publishConfig in each package.json sets access public and provenance.
      - name: Publish ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        env:
          NAME: ${{ steps.package.outputs.name }}
          # Empty unless bootstrapping a new package; npm uses OIDC otherwise.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace "$NAME"

      - name: Summary
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: echo "Published [\`${NAME}@${VERSION}\`](https://www.npmjs.com/package/${NAME}/v/${VERSION})" >> "$GITHUB_STEP_SUMMARY"
