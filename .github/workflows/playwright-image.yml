name: Playwright image

# Builds the e2e runner image in packages/playwright-config/image/ for the package's pinned
# @playwright/test version, and checks it by running the package's own Chromium browser tests inside
# it. On the release tag (`playwright-config-v<version>`, the one publish.yml stages the npm package
# from) it also pushes ghcr.io/wshno/playwright-config:<version>, signed with cosign, so the npm
# package and the image share a version.

on:
  pull_request:
    paths:
      - 'packages/playwright-config/image/**'
      - 'packages/playwright-config/package.json'
      - '.github/workflows/playwright-image.yml'
  push:
    tags:
      - 'playwright-config-v[0-9]*'

permissions: {}

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/wshno/playwright-config

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=packages/playwright-config/package.json
          version="$(jq -r .version "$manifest")"
          playwright="$(jq -r '.dependencies["@playwright/test"]' "$manifest")"
          [[ "$playwright" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::@playwright/test must be pinned to an exact version, got '$playwright'"
            exit 1
          }
          if [ "$EVENT" = push ] && [ "${TAG#playwright-config-v}" != "$version" ]; then
            echo "::error::$TAG says ${TAG#playwright-config-v}, $manifest says $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "playwright=$playwright"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/playwright-config/image
          platforms: linux/amd64
          build-args: PLAYWRIGHT_VERSION=${{ steps.versions.outputs.playwright }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.versions.outputs.version }}
          provenance: false

      # The package's own CSP and guard tests, Chromium project only (the image has no Firefox),
      # with browser downloads disabled: proves the image's headless shell matches the pinned
      # @playwright/test.
      - name: Test inside the image
        env:
          REF: ${{ env.IMAGE }}:${{ steps.versions.outputs.version }}
        run: |
          docker run --rm -e CI=true -v "$PWD:/repo" -w /repo "$REF" \
            sh -c 'npm ci && npm run test/browser --workspace @wshno/playwright-config -- --project=chromium'

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: ${{ github.event_name == 'push' }}
        env:
          REF: ${{ env.IMAGE }}:${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$REF"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up cosign
        if: ${{ github.event_name == 'push' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        if: ${{ github.event_name == 'push' }}
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Summary
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          PLAYWRIGHT: ${{ steps.versions.outputs.playwright }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pushed \`${IMAGE}:${VERSION}\` (Playwright ${PLAYWRIGHT}), signed:"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
